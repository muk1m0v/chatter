# Low-memory starting point for the 1 vCPU / 1 GiB staging host.
# Keep durability defaults (fsync, full_page_writes, synchronous_commit).
listen_addresses = '127.0.0.1'
max_connections = 16
shared_buffers = 96MB
effective_cache_size = 256MB
work_mem = 2MB
maintenance_work_mem = 32MB
wal_buffers = 8MB
checkpoint_timeout = 15min
max_wal_size = 256MB
min_wal_size = 32MB
max_parallel_workers = 0
max_parallel_maintenance_workers = 1
