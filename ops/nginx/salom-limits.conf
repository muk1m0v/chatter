# Included from nginx's http context (conf.d).
map $http_upgrade $salom_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=salom_api:5m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=salom_per_ip:5m;

log_format salom_safe '$remote_addr $time_iso8601 "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time';
