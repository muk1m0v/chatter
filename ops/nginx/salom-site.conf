# HTTP-only staging vhost. Request Let's Encrypt only after DNS points here.
server {
    listen 80;
    listen [::]:80;
    server_name mukimov.site;

    root /var/www/salom-site;
    index index.html;
    server_tokens off;
    client_max_body_size 26m;

    access_log /var/log/nginx/salom-access.log salom_safe;
    error_log /var/log/nginx/salom-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location = /salom/api/ws {
        limit_conn salom_per_ip 64;
        proxy_pass http://127.0.0.1:18731/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $salom_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location ^~ /salom/api/ {
        limit_req zone=salom_api burst=40 nodelay;
        limit_conn salom_per_ip 64;
        proxy_pass http://127.0.0.1:18731/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_buffering off;
    }

    location = /salom/version.json {
        alias /var/www/salom/version.json;
        default_type application/json;
        add_header Cache-Control no-store always;
    }

    location ^~ /salom/ {
        alias /var/www/salom/;
        autoindex off;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition 'attachment' always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
